<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TallyField</title>
<script>
  // TallyField has no path-based routing (screens are in-memory, not
  // URL-driven), so the only reason GitHub Pages would ever serve this
  // 404 page is a stray deep link or trailing path. Send it back to the
  // app root rather than showing GitHub's default "File not found".
  // Figure out the app's base path so this works whether it's hosted as
  // a project page (https://user.github.io/repo/) or a user/org root
  // page (https://user.github.io/) — the first path segment is the repo
  // name only in the project-page case.
  var parts = window.location.pathname.split('/').filter(Boolean);
  var base = window.location.hostname.endsWith('.github.io') && parts.length > 0
    ? '/' + parts[0] + '/'
    : '/';
  window.location.replace(base);
</script>
</head>
<body>
<p>Redirecting to TallyField…</p>
</body>
</html>
