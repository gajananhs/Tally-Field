<style>
:root{
  --navy-950:#0a1628;--navy-900:#0e1d34;--navy-800:#142748;--navy-700:#1c3660;
  --blue-500:#2f6fed;--blue-400:#5b8cf5;--blue-050:#eef4ff;
  --green-500:#1f9d63;--green-050:#e8f8f0;--amber-500:#c47f0a;--amber-050:#fdf3e2;
  --red-500:#d1453b;--red-050:#fbeae9;
  --ink-900:#0f1720;--ink-600:#4b5768;--ink-400:#8592a3;--ink-200:#d7dee6;--ink-100:#eef1f5;
  --surface-0:#ffffff;--surface-1:#f6f8fb;
  --font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;
  --radius-s:8px;--radius-m:12px;
  --shadow-card:0 1px 2px rgba(15,23,32,.06),0 1px 0 rgba(15,23,32,.04);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--font-body);color:var(--ink-900);background:var(--surface-1);
  -webkit-font-smoothing:antialiased;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:600;letter-spacing:-.01em;}
p{margin:0;}button{font-family:inherit;}a{color:inherit;}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}
#app-shell{max-width:1280px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

.topbar{position:sticky;top:0;z-index:30;background:var(--navy-950);color:#fff;
  padding:calc(12px + var(--safe-top)) 16px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--blue-400);}
.topbar-spacer{flex:1;}
.conn-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  padding:5px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
.conn-dot{width:6px;height:6px;border-radius:50%;}
.conn-online{background:rgba(31,157,99,.16);color:#4ade9b;}
.conn-online .conn-dot{background:#1f9d63;}
.conn-offline{background:rgba(196,127,10,.18);color:#f5b95c;}
.conn-offline .conn-dot{background:#c47f0a;}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;}
.user-chip .avatar{width:24px;height:24px;font-size:11px;}
.user-chip span{font-size:12px;font-weight:600;}
.icon-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.icon-btn svg{width:17px;height:17px;}
.badge-dot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:999px;background:var(--amber-500);
  border:2px solid var(--navy-950);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#0a1628;padding:0 3px;}

.tabbar{position:sticky;top:60px;z-index:25;background:var(--navy-900);display:flex;overflow-x:auto;
  -webkit-overflow-scrolling:touch;padding:0 12px;border-bottom:1px solid var(--navy-700);}
.tabbar::-webkit-scrollbar{display:none;}
.tabbar button{flex:0 0 auto;background:none;border:none;color:rgba(255,255,255,.6);padding:12px 15px;
  font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tabbar button[aria-current="true"]{color:#fff;border-bottom-color:var(--blue-400);}

main{flex:1;padding:20px 16px 60px;}
@media (min-width:768px){main{padding:26px 32px 60px;}}
.screen{max-width:760px;margin:0 auto;}
.screen-wide{max-width:1120px;margin:0 auto;}
.screen-header{margin-bottom:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.screen-header h1{font-size:21px;}
.screen-header .sub{color:var(--ink-600);font-size:13px;margin-top:4px;}
.back-link{background:none;border:none;color:var(--blue-500);font-weight:600;font-size:13px;cursor:pointer;padding:0 0 10px;display:inline-block;}

.card{background:var(--surface-0);border:1px solid var(--ink-100);border-radius:var(--radius-m);
  box-shadow:var(--shadow-card);padding:16px;}
.card+.card{margin-top:10px;}
.stack{display:flex;flex-direction:column;gap:12px;}
.row{display:flex;align-items:center;gap:10px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;
  border-radius:var(--radius-s);padding:11px 18px;border:1px solid transparent;cursor:pointer;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-block{width:100%;}
.btn-primary{background:var(--blue-500);color:#fff;}
.btn-primary:hover{background:#2960d4;}
.btn-secondary{background:var(--surface-0);color:var(--navy-950);border-color:var(--ink-200);}
.btn-secondary:hover{background:var(--surface-1);}
.btn-danger{background:none;color:var(--red-500);border:none;}
.btn-ghost{background:none;border:none;color:var(--blue-500);}
.btn-sm{padding:7px 12px;font-size:13px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:13px;font-weight:600;color:var(--ink-600);}
.field input,.field select,.field textarea{font-family:inherit;font-size:15px;padding:10px 12px;
  border-radius:var(--radius-s);border:1px solid var(--ink-200);width:100%;background:#fff;color:var(--ink-900);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue-500);}
.field.invalid input{border-color:var(--red-500);}
.field-error{font-size:12px;color:var(--red-500);}
.field-hint{font-size:12px;color:var(--ink-400);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.field-row{grid-template-columns:1fr;}}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.chip-neutral{background:var(--ink-100);color:var(--ink-600);}
.chip-blue{background:var(--blue-050);color:var(--blue-500);}
.chip-green{background:var(--green-050);color:var(--green-500);}
.chip-amber{background:var(--amber-050);color:var(--amber-500);}
.chip-red{background:var(--red-050);color:var(--red-500);}
.banner{border-radius:var(--radius-s);padding:11px 14px;font-size:13px;font-weight:500;margin-bottom:14px;}
.banner-amber{background:var(--amber-050);color:#7a5106;}
.banner-red{background:var(--red-050);color:#8f2f28;}
.empty-state{text-align:center;padding:44px 20px;color:var(--ink-600);}
.empty-state h3{font-size:16px;margin-bottom:6px;color:var(--ink-900);}
.empty-state p{font-size:13px;margin-bottom:16px;}
.skeleton{background:linear-gradient(90deg,var(--ink-100) 25%,var(--ink-200) 37%,var(--ink-100) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--radius-s);}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
.skel-card{height:78px;margin-bottom:10px;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (min-width:640px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.kpi-tile{background:var(--surface-0);border:1px solid var(--ink-100);border-radius:var(--radius-m);
  padding:16px;box-shadow:var(--shadow-card);text-align:left;cursor:pointer;}
.kpi-tile:hover{border-color:var(--blue-400);}
.kpi-tile .label{font-size:12px;color:var(--ink-600);font-weight:600;}
.kpi-tile .value{font-family:var(--font-display);font-size:23px;font-weight:700;margin-top:4px;}
.toggle-group{display:flex;background:var(--ink-100);border-radius:var(--radius-s);padding:3px;gap:3px;flex-wrap:wrap;}
.toggle-group button{flex:1;min-width:90px;border:none;background:transparent;padding:9px 8px;border-radius:6px;
  cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-600);}
.toggle-group button[aria-pressed="true"]{background:var(--surface-0);color:var(--navy-950);box-shadow:var(--shadow-card);}
.section-title{font-size:13px;font-weight:700;color:var(--ink-600);margin:20px 0 10px;text-transform:uppercase;letter-spacing:.03em;}
.section-title:first-child{margin-top:0;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-400);
  padding:9px 10px;border-bottom:1px solid var(--ink-200);white-space:nowrap;}
td{padding:11px 10px;border-bottom:1px solid var(--ink-100);white-space:nowrap;}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:var(--surface-1);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-050);color:var(--blue-500);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.feed-row{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--ink-100);}
.feed-row:last-child{border-bottom:none;}
.map-box{border-radius:var(--radius-m);background:linear-gradient(135deg,var(--navy-900),var(--navy-800));
  color:#fff;padding:16px;display:flex;flex-direction:column;gap:10px;}
.map-pin-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(255,255,255,.06);border-radius:8px;cursor:pointer;}
.map-pin-row:hover{background:rgba(255,255,255,.1);}
.pin-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.single-pin{height:150px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;}
.photo-slot{border-radius:var(--radius-m);border:2px dashed var(--ink-200);padding:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--ink-400);background:var(--surface-0);cursor:pointer;width:100%;text-align:center;}
.photo-slot.has-photo{border-style:solid;color:var(--navy-950);border-color:var(--green-500);}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy-950);color:#fff;
  padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:100;max-width:90vw;text-align:center;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,22,40,.5);z-index:80;display:flex;
  align-items:flex-end;justify-content:center;padding:0;}
@media (min-width:640px){.modal-overlay{align-items:center;padding:24px;}}
.modal{background:#fff;border-radius:18px 18px 0 0;max-width:520px;width:100%;max-height:92vh;
  overflow-y:auto;padding:22px;box-shadow:0 -8px 30px rgba(0,0,0,.2);}
@media (min-width:640px){.modal{border-radius:18px;}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-close{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-400);padding:4px;}

/* login */
.login-wrap{min-height:calc(100vh - 2px);display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:360px;}
.login-logo{width:52px;height:52px;border-radius:14px;background:var(--navy-950);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:20px;margin:0 auto 16px;}
</style>
</head>

function loadDb() {
  try { const raw = localStorage.getItem(TF_DB_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  const fresh = seedDb();
  saveDb(fresh);
  return fresh;
}
function saveDb(d) { localStorage.setItem(TF_DB_KEY, JSON.stringify(d)); }
let db = loadDb();

function loadSession() {
  try { const raw = localStorage.getItem(TF_SESSION_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function saveSession(s) { s ? localStorage.setItem(TF_SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(TF_SESSION_KEY); }
function loadToken() { return localStorage.getItem(TF_TOKEN_KEY) || null; }
function saveToken(t) { t ? localStorage.setItem(TF_TOKEN_KEY, t) : localStorage.removeItem(TF_TOKEN_KEY); }

/* ---------------- app state (session-derived, not itself persisted) ---------------- */
const state = {
  session: loadSession(), // { userId }
  token: loadToken(),     // the real backend's JWT, sent as Authorization: Bearer <token>
  screen: 'login',
  params: {},
  online: navigator.onLine,
  dashboardFilter: null,
  loading: false,
};
if (state.session && state.token && currentUser()) state.screen = currentUser().role === 'rep' ? 'rep-home' : 'owner-dashboard';

/* ---------------- helpers ---------------- */
function esc(str) { return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function money(n) { return n === null || n === undefined ? '—' : '₹' + Number(n).toLocaleString('en-IN'); }
function uid() { return 'id_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function today() { return new Date().toISOString().slice(0, 10); }
function currentUser() { return state.session ? db.users.find((u) => u.id === state.session.userId) : null; }
function customerById(id) { return db.customers.find((c) => c.id === id); }
function tallyPartyFor(customer) { return customer ? db.tally_parties.find((tp) => tp.id === customer.tally_party_id) : null; }
function userById(id) { return db.users.find((u) => u.id === id); }
function userName(id) { return userById(id)?.name || '—'; }
function repsList() { return db.users.filter((u) => u.role === 'rep'); }
function haversineKm(lat1, lng1, lat2, lng2) {
  if (lat1 == null || lat2 == null) return null;
  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
const REP_ORIGIN = { lat: 13.02, lng: 77.55 }; // simulated "current rep location" for distance display

function nav(screen, params = {}) {
  state.screen = screen;
  state.params = params;
  state.loading = true;
  renderShell();
  setTimeout(() => { state.loading = false; renderShell(); document.getElementById('main').focus(); }, 260);
}
function rerender() { document.getElementById('main').innerHTML = SCREENS[state.screen].html(); SCREENS[state.screen].wire(); }
function showToast(msg) {
  let el = document.getElementById('toast');
  if (el) el.remove();
  el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.remove(), 2600);
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
function openModal(html) {
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" id="modal-overlay"><div class="modal">${html}</div></div>`;
  document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });
}

/* ---------------- shared UI primitives ---------------- */
function chip(text, tone = 'neutral') { return `<span class="chip chip-${tone}">${esc(text)}</span>`; }
function banner(text, tone = 'amber') { return `<div class="banner banner-${tone}">${text}</div>`; }
function emptyState(title, body, actionHtml = '') { return `<div class="empty-state"><h3>${esc(title)}</h3><p>${esc(body)}</p>${actionHtml}</div>`; }
function skeletonCards(n = 3) { return Array.from({ length: n }).map(() => `<div class="card skeleton skel-card"></div>`).join(''); }
const SYNC_TONE = { synced: 'green', pending: 'amber', failed: 'red' };
const OUTCOME_LABEL = { order: 'Order', collection: 'Collection', note: 'Note' };
const OUTCOME_TONE = { order: 'blue', collection: 'green', note: 'neutral' };
function visitStatusChip(s) {
  return { not_visited: chip('Not visited', 'neutral'), checked_in: chip('Checked in', 'blue'), completed: chip('Completed', 'green') }[s] || '';
}
function pendingCountFor(userId) {
  const role = userById(userId)?.role;
  if (role === 'owner') return db.field_transactions.filter((t) => t.sync_status !== 'synced').length;
  return db.field_transactions.filter((t) => t.sync_status !== 'synced' && t.rep_id === userId).length;
}

  const u = currentUser();

  const pending = pendingCountFor(u.id);

  top.innerHTML = `
    <div class="brand"><span class="dot"></span> TallyField</div>
    <div class="topbar-spacer"></div>
    ${connChip}
    ${installBtn}
    <button class="icon-btn" id="sync-icon-btn" aria-label="Sync queue, ${pending} pending">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg>

    <button class="user-chip" id="user-chip-btn" aria-label="Switch user or role">
      <span class="avatar">${esc(u.name.split(' ').map((n) => n[0]).join('').slice(0, 2))}</span>

}
function openUserSwitcher() {
  const u = currentUser();
  // With real OTP auth behind this, there's no "switch to another
  // identity" shortcut anymore — that would mean bypassing login
  // entirely. This is now just account info + a real logout.
  openModal(`
    <div class="modal-header"><h2 style="font-size:18px;">Account</h2><button class="modal-close" id="modal-close">&times;</button></div>
    <div class="card row-between">
      <div class="row"><span class="avatar">${esc(u.name.split(' ').map((n) => n[0]).join('').slice(0, 2))}</span>
        <div><div style="font-size:14px;font-weight:600;">${esc(u.name)}</div><div style="font-size:12px;color:var(--ink-600);">${u.role === 'owner' ? 'Owner' : 'Field Rep'} · ${esc(u.phone)}</div></div></div>
    </div>
    <div class="section-title">Session</div>
    <button class="btn btn-secondary btn-block" id="logout-btn">Log Out</button>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('logout-btn').addEventListener('click', () => {
    if (state.token) {

      fetch(`${API_BASE}/auth/logout.php`, { method: 'POST', headers: { Authorization: `Bearer ${state.token}` } }).catch(() => {});
    }
    state.session = null; state.token = null; saveSession(null); saveToken(null); closeModal(); nav('login');
  });
}
const TABS = {
  owner: [
    { id: 'owner-dashboard', label: 'Dashboard' },
    { id: 'reports', label: 'Reports' },
    { id: 'settings', label: 'Settings' },
  ],
  rep: [
    { id: 'rep-home', label: "Today's Visits" },
    { id: 'sync-status', label: 'Sync Status' },
  ],
};
function renderTabbar() {
  const bar = document.getElementById('tabbar');
  if (!state.session) { bar.innerHTML = ''; return; }
  const role = currentUser().role;
  const tabs = TABS[role];
  const activeGroup = tabs.some((t) => t.id === state.screen) ? state.screen

}

/* ================================================================
   SCREEN 1 — LOGIN (real OTP via the backend at API_BASE)
   ================================================================ */
let loginState = { otpSent: false, phone: '', countdown: 0, sending: false };
function screenLogin() {
  const s = loginState;
  return `
  <div class="login-wrap screen">
    <div class="card login-card">
      <div class="login-logo">TF</div>
      <h1 style="text-align:center;font-size:20px;margin-bottom:4px;">Sign in to TallyField</h1>
      <p style="text-align:center;color:var(--ink-600);font-size:13px;margin-bottom:18px;">Field sales, synced to Tally</p>
      <form id="login-form" class="stack" novalidate>
        <div class="field" id="phone-field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" inputmode="numeric" placeholder="10-digit mobile number" ${s.otpSent ? 'readonly' : ''} value="${esc(s.phone)}">
          <div class="field-error visually-hidden" id="phone-error" role="alert"></div>
        </div>
        ${s.otpSent ? `
        <div class="field" id="otp-field">
          <label for="otp">Enter 6-digit OTP</label>
          <input type="text" id="otp" inputmode="numeric" placeholder="6-digit code" autofocus maxlength="6">
          <div class="field-error visually-hidden" id="otp-error" role="alert"></div>
          <span class="field-hint" id="resend-hint">${s.countdown > 0 ? `Resend OTP (${s.countdown}s)` : ''}</span>
        </div>` : ''}
        <button type="submit" class="btn btn-primary" id="login-submit" ${s.sending ? 'disabled' : ''}>${s.sending ? 'Please wait…' : s.otpSent ? 'Verify & Continue' : 'Send OTP'}</button>
        ${s.otpSent && s.countdown === 0 ? `<button type="button" class="btn btn-ghost" id="resend-btn">Resend OTP</button>` : ''}
      </form>
    </div>
  </div>`;
}
function wireLogin() {
  const form = document.getElementById('login-form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const s = loginState;
    if (!s.otpSent) requestOtp(document.getElementById('phone').value.trim());
    else verifyOtp(document.getElementById('otp').value.trim());
  });
  const resendBtn = document.getElementById('resend-btn');
  if (resendBtn) resendBtn.addEventListener('click', () => requestOtp(loginState.phone, true));
}

async function requestOtp(phone, isResend = false) {
  if (!/^[6-9]\d{9}$/.test(phone)) return markInvalid('phone-field', 'phone-error', 'Enter a valid 10-digit number');
  clearInvalid('phone-field', 'phone-error');
  loginState.sending = true;
  if (!isResend) rerender(); else { const btn = document.getElementById('login-submit'); if (btn) btn.disabled = true; }

  try {
    const res = await fetch(`${API_BASE}/auth/send-otp.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone }),
    });
    const data = await res.json().catch(() => ({}));
    loginState.sending = false;

    if (!res.ok) {
      // A network-reachable server said no — show its reason (bad
      // format, or the SMS gateway itself failed to send).
      loginState.otpSent = false;
      rerender();
      return markInvalid('phone-field', 'phone-error', data.message || "Couldn't send the code — try again");
    }

    loginState.phone = phone;
    loginState.otpSent = true;
    loginState.countdown = 30;
    rerender();
    startCountdown();
    if (isResend) showToast('OTP resent');
  } catch (err) {
    // fetch() itself threw — no response at all (offline, DNS failure,
    // CORS block, or API_BASE not actually deployed yet).
    loginState.sending = false;
    loginState.otpSent = false;
    rerender();
    markInvalid('phone-field', 'phone-error', "Couldn't reach the server — check your connection and API_BASE");
  }
}

async function verifyOtp(otp) {
  if (!/^\d{6}$/.test(otp)) return markInvalid('otp-field', 'otp-error', 'Enter the 6-digit code');
  clearInvalid('otp-field', 'otp-error');
  loginState.sending = true;
  const btn = document.getElementById('login-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Verifying…'; }

  try {
    const res = await fetch(`${API_BASE}/auth/verify-otp.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: loginState.phone, otp }),
    });
    const data = await res.json().catch(() => ({}));
    loginState.sending = false;

    if (!res.ok) {
      // The backend distinguishes these — surface its actual reason
      // rather than a generic failure (matches send-otp's error style).
      // otp_mismatch / otp_expired / otp_not_requested / too_many_attempts
      if (btn) { btn.disabled = false; btn.textContent = 'Verify & Continue'; }
      return markInvalid('otp-field', 'otp-error', data.message || 'Verification failed — try again');
    }

    state.token = data.token;
    state.session = { userId: data.user.id };
    saveToken(state.token);
    saveSession(state.session);
    loginState = { otpSent: false, phone: '', countdown: 0, sending: false };
    showToast('Welcome, ' + data.user.name);
    nav(data.user.role === 'rep' ? 'rep-home' : 'owner-dashboard');
  } catch (err) {
    loginState.sending = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Verify & Continue'; }
    markInvalid('otp-field', 'otp-error', "Couldn't reach the server — check your connection and try again");
  }
}

function startCountdown() {
  clearInterval(startCountdown._t);
  startCountdown._t = setInterval(() => {
    loginState.countdown--;
    const hint = document.getElementById('resend-hint');
    if (hint) hint.textContent = loginState.countdown > 0 ? `Resend OTP (${loginState.countdown}s)` : '';
    if (loginState.countdown <= 0) { clearInterval(startCountdown._t); rerender(); }
  }, 1000);
}
function markInvalid(fieldId, errId, msg) { document.getElementById(fieldId).classList.add('invalid'); const e = document.getElementById(errId); e.textContent = msg; e.classList.remove('visually-hidden'); }
function clearInvalid(fieldId, errId) { document.getElementById(fieldId).classList.remove('invalid'); const e = document.getElementById(errId); e.textContent = ''; e.classList.add('visually-hidden'); }

function screenRepHome() {
  if (state.loading) return `<div class="screen">${skeletonCards()}</div>`;
  const u = currentUser();
  const visits = db.visits.filter((v) => v.rep_id === u.id && v.date === today());
  return `
  <div class="screen">
    <div class="screen-header row-between">
      <div><h1>Today's Visits</h1><p class="sub">${new Date().toDateString()} · ${esc(u.name)}</p></div>
      <button class="btn btn-secondary btn-sm" id="add-visit-btn">+ Add Visit</button>
    </div>
    ${!state.online ? banner('Offline — showing last loaded data. Check-ins still save locally.', 'amber') : ''}
    <div class="stack">
      ${visits.length === 0 ? emptyState('No visits planned for today', 'Add an unplanned stop to get started.', `<button class="btn btn-primary" id="add-visit-empty">+ Add Visit</button>`) :
        visits.map((v) => {
          const c = customerById(v.customer_id);
          const tp = tallyPartyFor(c);
          const dist = haversineKm(REP_ORIGIN.lat, REP_ORIGIN.lng, c.gps_lat, c.gps_lng);
          return `<div class="card">
            <div class="row-between">
              <div><h3 style="font-size:15px;">${esc(c.name)}</h3><p class="sub" style="font-size:12px;margin-top:2px;">${esc(c.address)}${dist !== null ? ' · ' + dist.toFixed(1) + ' km away' : ''}</p></div>
              ${visitStatusChip(v.status)}
            </div>
            <div class="row-between" style="margin-top:12px;">
              <span style="font-size:13px;color:var(--ink-600);">Outstanding: <strong style="color:var(--ink-900);">${tp ? money(tp.balance) : '—'}</strong></span>
              <div class="row" style="gap:8px;">
                <button class="btn btn-secondary btn-sm" data-open-customer="${c.id}">View</button>
                <button class="btn btn-primary btn-sm" data-checkin="${c.id}">${v.status === 'not_visited' ? 'Check In' : v.status === 'checked_in' ? 'Log Outcome' : 'View Outcome'}</button>
              </div>
            </div>
          </div>`;
        }).join('')}
    </div>
    <div style="text-align:center;margin-top:16px;"><button class="btn btn-ghost" id="view-all-customers">View All Customers</button></div>
  </div>`;
}
function wireRepHome() {
  if (state.loading) return;
  document.querySelectorAll('[data-open-customer]').forEach((b) => b.addEventListener('click', () => nav('customer-detail', { customerId: b.dataset.openCustomer })));
  document.querySelectorAll('[data-checkin]').forEach((b) => b.addEventListener('click', () => {
    const cid = b.dataset.checkin;
    const v = db.visits.find((vv) => vv.customer_id === cid && vv.rep_id === currentUser().id && vv.date === today());
    if (v && v.status !== 'not_visited') nav('log-outcome', { customerId: cid, visitId: v.id });
    else nav('checkin', { customerId: cid });
  }));
  const add = document.getElementById('add-visit-btn') || document.getElementById('add-visit-empty');
  if (add) add.addEventListener('click', openCustomerSearchModal);
  document.getElementById('view-all-customers').addEventListener('click', openCustomerSearchModal);
}
function openCustomerSearchModal() {
  const u = currentUser();
  const mine = db.customers.filter((c) => c.assigned_rep_id === u.id);
  openModal(`
    <div class="modal-header"><h2 style="font-size:18px;">Find a Customer</h2><button class="modal-close" id="modal-close">&times;</button></div>

function wireLogOutcome() {
  document.querySelectorAll('[data-type]').forEach((b) => b.addEventListener('click', () => { outcomeType = b.dataset.type; rerender(); }));

  if (fu) fu.addEventListener('change', () => { document.getElementById('o-followup-date-field').style.display = fu.checked ? 'flex' : 'none'; });
  document.getElementById('outcome-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const u = currentUser();
    const cid = state.params.customerId;
    const visit = db.visits.find((v) => v.id === state.params.visitId) || db.visits.find((v) => v.customer_id === cid && v.rep_id === u.id && v.date === today());

    if (outcomeType === 'note') {

      visit.notes = document.getElementById('o-note').value;
      saveDb(db);
      showToast('Note saved');
      nav('rep-home');
      return;
    }

    const tx = { id: uid(), tenant_id: 't1', visit_id: visit.id, rep_id: u.id, customer_id: cid, type: outcomeType, sync_status: 'pending', claimed_by: null, claimed_at: null, tally_voucher_id: null, retry_count: 0, error_reason: null, created_at: new Date().toISOString() };

      tx.items_json = [{ item: document.getElementById('o-item').value, qty: Number(document.getElementById('o-qty').value) || 0 }];

    } else {
      const amt = Number(document.getElementById('o-amount').value);
      if (!amt || amt <= 0) { markInvalid('amount-field', 'amount-error', 'Enter a valid amount'); return; }
      clearInvalid('amount-field', 'amount-error');
      tx.amount = amt; tx.payment_mode = document.getElementById('o-paymode').value; tx.ref_no = document.getElementById('o-ref').value; tx.items_json = null;
      const tp = tallyPartyFor(customerById(cid));
      if (tp) tp.balance = Math.max(0, tp.balance - amt);
    }
    visit.status = 'completed';
    visit.outcome_type = outcomeType;
    db.field_transactions.unshift(tx);
    saveDb(db);
    showToast(state.online ? 'Outcome saved — syncing to Tally' : 'Saved — will sync to Tally when online');

    setTimeout(() => {
      const t = db.field_transactions.find((x) => x.id === tx.id);
      if (t && t.sync_status === 'pending') {
        t.sync_status = 'synced'; t.tally_voucher_id = 'RCPT-' + Math.floor(2000 + Math.random() * 900);

  });
}

function filterByRange(rows, dateField, range) {
  const now = new Date();
  if (range === 'today') return rows.filter((r) => (r[dateField] || '').slice(0, 10) === today());
  if (range === 'week') { const weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 7); return rows.filter((r) => new Date(r[dateField] || 0) >= weekAgo); }
  if (range === 'custom' && state.params.customFrom && state.params.customTo) {
    return rows.filter((r) => (r[dateField] || '').slice(0, 10) >= state.params.customFrom && (r[dateField] || '').slice(0, 10) <= state.params.customTo);
  }
  return rows;
}

}

        <button class="btn btn-secondary btn-sm" id="export-pdf">Export PDF</button>
      </div>
    </div>
    <div class="row-between" style="margin-bottom:14px;flex-wrap:wrap;gap:12px;">
      <div class="toggle-group" style="max-width:440px;">
        <button aria-pressed="${reportTab === 'visits'}" data-tab="visits">Visit Log</button>
        <button aria-pressed="${reportTab === 'collections'}" data-tab="collections">Collections</button>
        <button aria-pressed="${reportTab === 'outstanding'}" data-tab="outstanding">Outstanding by Rep</button>
      </div>
      <select id="rep-filter" style="padding:9px 12px;border-radius:8px;border:1px solid var(--ink-200);">
        <option value="">All Reps</option>
        ${repsList().map((r) => `<option value="${r.id}" ${repFilter === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}
      </select>
    </div>
    <div class="table-scroll card" style="padding:0;">
      ${reportTab === 'visits' ? `<table><thead><tr><th>Date</th><th>Customer</th><th>Rep</th><th>Status</th></tr></thead>
        <tbody>${rows.length ? rows.map((v) => `<tr><td>${esc(v.date)}</td><td>${esc(customerById(v.customer_id)?.name || '—')}</td><td>${esc(userName(v.rep_id))}</td><td>${visitStatusChip(v.status)}</td></tr>`).join('') : `<tr><td colspan="4" style="text-align:center;color:var(--ink-600);">No data for this range</td></tr>`}</tbody></table>` : ''}
      ${reportTab === 'collections' ? `<table><thead><tr><th>Date</th><th>Customer</th><th>Rep</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody>${rows.length ? rows.map((t) => `<tr><td>${new Date(t.created_at).toLocaleDateString()}</td><td>${esc(customerById(t.customer_id)?.name || '—')}</td><td>${esc(userName(t.rep_id))}</td><td>${money(t.amount)}</td><td>${chip(t.sync_status, SYNC_TONE[t.sync_status])}</td></tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--ink-600);">No data for this range</td></tr>`}</tbody></table>` : ''}
      ${reportTab === 'outstanding' ? `<table><thead><tr><th>Customer</th><th>Rep</th><th>Balance</th></tr></thead>
        <tbody>${rows.length ? rows.map((c) => `<tr><td>${esc(c.name)}</td><td>${esc(userName(c.assigned_rep_id))}</td><td>${money(tallyPartyFor(c)?.balance)}</td></tr>`).join('') : `<tr><td colspan="3" style="text-align:center;color:var(--ink-600);">No data for this range</td></tr>`}</tbody></table>` : ''}
    </div>
  </div>`;
}
function wireReports() {
  if (state.loading) return;
  document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { reportTab = b.dataset.tab; rerender(); }));
  document.getElementById('rep-filter').addEventListener('change', (e) => { state.params.repFilter = e.target.value; rerender(); });
  document.getElementById('export-csv').addEventListener('click', exportCsv);
  document.getElementById('export-pdf').addEventListener('click', () => showToast('PDF export would download here'));
}
function exportCsv() {
  let headers = [], rows = [];
  const repFilter = state.params.repFilter || '';
  if (reportTab === 'visits') {
    headers = ['Date', 'Customer', 'Rep', 'Status'];
    rows = db.visits.filter((v) => !repFilter || v.rep_id === repFilter).map((v) => [v.date, customerById(v.customer_id)?.name || '', userName(v.rep_id), v.status]);
  } else if (reportTab === 'collections') {
    headers = ['Date', 'Customer', 'Rep', 'Amount', 'Status'];
    rows = db.field_transactions.filter((t) => t.type === 'collection' && (!repFilter || t.rep_id === repFilter)).map((t) => [new Date(t.created_at).toLocaleDateString(), customerById(t.customer_id)?.name || '', userName(t.rep_id), t.amount, t.sync_status]);
  } else {
    headers = ['Customer', 'Rep', 'Balance'];
    rows = db.customers.filter((c) => !repFilter || c.assigned_rep_id === repFilter).map((c) => [c.name, userName(c.assigned_rep_id), tallyPartyFor(c)?.balance ?? '']);
  }
  const csv = [headers.join(','), ...rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tallyfield-${reportTab}-${today()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('CSV downloaded');
}

/* ================================================================
   SCREEN 10 — SETTINGS (Owner only) — Tally connection + rep management
   ================================================================ */
function screenSettings() {
  const s = db.settings;
  return `
  <div class="screen">
    <div class="screen-header"><h1>Tally Connection Settings</h1></div>
    <div class="card">
      <div class="row-between">
        <div><div style="font-weight:600;font-size:14px;">${esc(db.tenants[0].tally_company_name)}</div>
        <div style="font-size:12px;color:var(--ink-600);">Last synced ${new Date(s.last_sync).toLocaleString()}</div></div>
        ${chip(s.agent_status === 'connected' ? 'Connected' : s.agent_status === 'error' ? 'Error' : 'Disconnected', s.agent_status === 'connected' ? 'green' : s.agent_status === 'error' ? 'red' : 'neutral')}
      </div>
      <div class="row-between" style="margin-top:14px;">
        <span style="font-size:12px;color:var(--ink-600);">Install Key</span>
        <code style="font-size:12px;background:var(--surface-1);padding:4px 8px;border-radius:6px;">${esc(s.install_key)}</code>
      </div>
      <div class="stack" style="margin-top:14px;">
        <button class="btn btn-secondary" id="download-agent">Download Sync Agent</button>
        <button class="btn btn-secondary" id="copy-key">Copy Install Key</button>
        <button class="btn btn-primary" id="test-conn">Test Connection</button>
      </div>
    </div>

    <div class="section-title">Field Reps</div>
    ${banner("This list is local to your browser for demo purposes — it doesn't grant real login access. Add a rep to the real users table (with their actual phone number) for them to sign in for real.", 'amber')}
    <div class="card">
      ${repsList().map((r) => {
        const custCount = db.customers.filter((c) => c.assigned_rep_id === r.id).length;
        return `<div class="row-between" style="padding:9px 0;border-bottom:1px solid var(--ink-100);">
          <div><div style="font-size:13px;font-weight:600;">${esc(r.name)}</div><div style="font-size:12px;color:var(--ink-600);">${esc(r.phone)} · ${custCount} customers assigned</div></div>
          <button class="btn btn-danger" data-remove-rep="${r.id}">Remove</button>
        </div>`;
      }).join('')}
      <button class="btn btn-secondary btn-sm" style="margin-top:10px;" id="add-rep-btn">+ Add Rep</button>
    </div>
  </div>`;
}
function wireSettings() {
  document.getElementById('download-agent').addEventListener('click', () => showToast('Sync agent download would start here'));
  document.getElementById('copy-key').addEventListener('click', () => {
    const key = db.settings.install_key;
    if (navigator.clipboard) navigator.clipboard.writeText(key).then(() => showToast('Install key copied')).catch(() => showToast(key));
    else showToast(key);
  });
  document.getElementById('test-conn').addEventListener('click', (e) => {
    const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Testing…';
    setTimeout(() => {
      btn.disabled = false; btn.textContent = 'Test Connection';
      db.settings.agent_status = 'connected'; db.settings.last_sync = new Date().toISOString();
      saveDb(db); showToast('Connection OK'); rerender();
    }, 900);
  });
  document.getElementById('add-rep-btn').addEventListener('click', openAddRepModal);
  document.querySelectorAll('[data-remove-rep]').forEach((b) => b.addEventListener('click', () => {
    const repId = b.dataset.removeRep;
    db.customers.filter((c) => c.assigned_rep_id === repId).forEach((c) => { c.assigned_rep_id = null; });
    db.users = db.users.filter((u) => u.id !== repId);
    saveDb(db);
    showToast('Rep removed — their customers are now unassigned');
    rerender();
  }));
}
function openAddRepModal() {
  openModal(`
    <div class="modal-header"><h2 style="font-size:18px;">Add Rep</h2><button class="modal-close" id="modal-close">&times;</button></div>
    <form id="add-rep-form" class="stack" novalidate>
      <div class="field"><label for="ar-name">Name</label><input id="ar-name" required></div>
      <div class="field"><label for="ar-phone">Phone number</label><input id="ar-phone" inputmode="numeric" placeholder="10-digit mobile number" required></div>
      <div class="field-error visually-hidden" id="ar-error" role="alert"></div>
      <button type="submit" class="btn btn-primary btn-block">Add Rep</button>
    </form>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('add-rep-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('ar-name').value.trim();
    const phone = document.getElementById('ar-phone').value.trim();
    if (!name || !/^[6-9]\d{9}$/.test(phone)) { const err = document.getElementById('ar-error'); err.textContent = 'Enter a name and a valid 10-digit phone number'; err.classList.remove('visually-hidden'); return; }
    if (db.users.some((u) => u.phone === phone)) { const err = document.getElementById('ar-error'); err.textContent = 'That phone number is already registered'; err.classList.remove('visually-hidden'); return; }
    db.users.push({ id: uid(), tenant_id: 't1', role: 'rep', name, phone });
    saveDb(db);
    closeModal(); showToast('Rep added'); rerender();
  });
}

  'rep-drilldown': { html: screenRepDrilldown, wire: wireRepDrilldown },
  'reports': { html: screenReports, wire: wireReports },
  'settings': { html: screenSettings, wire: wireSettings },
};
function renderShell() { renderTopbar(); renderTabbar(); rerender(); }

/* ---------------- connectivity ---------------- */
window.addEventListener('offline', () => { state.online = false; renderShell(); showToast("You're offline — changes save locally"); });
window.addEventListener('online', () => { state.online = true; renderShell(); showToast('Back online'); });

/* ---------------- installability ---------------- */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstallPrompt = e; renderTopbar(); });
window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; renderTopbar(); });

/* ---------------- service worker ---------------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').then((reg) => {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; window.location.reload(); });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  });
}

renderShell();
</script>
